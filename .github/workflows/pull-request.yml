name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-changes:
    name: Check what files changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      opa-evaluator: ${{ steps.changes.outputs.opa-evaluator }}
      opa-jackson: ${{ steps.changes.outputs.opa-jackson }}
      opa-services: ${{ steps.changes.outputs.opa-services }}
      opa-builtins: ${{ steps.changes.outputs.opa-builtins }}
      opa-slf4j: ${{ steps.changes.outputs.opa-slf4j }}
      opa-proto: ${{ steps.changes.outputs.opa-proto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest

      - name: Check for file changes
        id: changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          echo "opa-evaluator=true" >> $GITHUB_OUTPUT
          echo "opa-jackson=true" >> $GITHUB_OUTPUT
          echo "opa-services=true" >> $GITHUB_OUTPUT
          echo "opa-builtins=true" >> $GITHUB_OUTPUT
          echo "opa-slf4j=true" >> $GITHUB_OUTPUT
          echo "opa-proto=true" >> $GITHUB_OUTPUT

          if ! curl -s -o changed_files.json -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GH_REPO}/pulls/${PR_NUMBER}/files"; then
            echo "Failed to fetch changed files, defaulting to running all checks"
            exit 0
          fi

          if [ ! -s changed_files.json ]; then
            echo "No changed files found, defaulting to running all checks"
            exit 0
          fi

          echo "Changed files:"
          jq -r '.[].filename' changed_files.json

          opa eval \
            --data tools/policy/pr-check/pr_check.rego \
            --input changed_files.json \
            --format pretty \
            'data.policy["pr-check"]' > opa_result.json

          echo "OPA result:"
          cat opa_result.json

          opa_evaluator=$(jq -r '.changes["opa-evaluator"] // false' opa_result.json)
          opa_jackson=$(jq -r '.changes["opa-jackson"] // false' opa_result.json)
          opa_services=$(jq -r '.changes["opa-services"] // false' opa_result.json)
          opa_builtins=$(jq -r '.changes["opa-builtins"] // false' opa_result.json)
          opa_slf4j=$(jq -r '.changes["opa-slf4j"] // false' opa_result.json)
          opa_proto=$(jq -r '.changes["opa-proto"] // false' opa_result.json)

          echo "opa-evaluator=${opa_evaluator}" >> $GITHUB_OUTPUT
          echo "opa-jackson=${opa_jackson}" >> $GITHUB_OUTPUT
          echo "opa-services=${opa_services}" >> $GITHUB_OUTPUT
          echo "opa-builtins=${opa_builtins}" >> $GITHUB_OUTPUT
          echo "opa-slf4j=${opa_slf4j}" >> $GITHUB_OUTPUT
          echo "opa-proto=${opa_proto}" >> $GITHUB_OUTPUT

  gh-actions-lint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # zizmor-action uploads its SARIF results to the Security tab
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  rego-policy:
    name: Rego Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest
      # tools/policy/ holds the Rego that drives this workflow's own change
      # filter. A parse/type error or a broken rule there would silently break
      # CI gating, so type-check it strictly and run its unit tests.
      - name: Check policy
        run: opa check --strict tools/policy/
      - name: Test policy
        run: opa test tools/policy/ -v

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Diffs the dependency graph between the PR base and head, failing on newly
      # introduced vulnerabilities or disallowed licenses. Relies on the baseline
      # graph submitted by dependency-submission.yml on pushes to main.
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  lint:
    name: Checkstyle & PMD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew checkstyleMain checkstyleTest pmdMain pmdTest

  validate-pom:
    name: Validate Publish POMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Generate POMs
        run: ./gradlew generatePomFileForMavenPublication
      # Maven's built-in model validator catches the rule that bit us at v0.1.0:
      # `'dependencies.dependency.version' for X is missing`. Resolves BOM imports
      # (jackson-bom etc.), so deps managed via <dependencyManagement> are accepted.
      # Does NOT check Central-specific completeness rules (name/description/license/scm) —
      # the release gate (publishToMavenCentral against Central Portal) covers those.
      - name: Validate POMs via Maven's model validator
        run: |
          set -e
          failed=0
          for pom in $(find . -path '*/build/publications/maven/pom-default.xml'); do
            echo "::group::$pom"
            mvn -B --no-transfer-progress -f "$pom" validate || failed=1
            echo "::endgroup::"
          done
          exit $failed

  capabilities-check:
    name: Verify capabilities.json is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Regenerate capabilities.json
        run: ./gradlew :cli:generateCapabilities
      # capabilities.json is a published artifact: it is attached to each GitHub release and
      # consumed downstream (OPA's builtin docs report which implementations support each
      # builtin). Adding or changing a builtin must update it in the same PR.
      - name: Fail if capabilities.json is stale
        run: |
          if ! git diff --exit-code -- capabilities.json; then
            echo "::error::capabilities.json is out of date with the registered builtins."
            echo "Run ./gradlew :cli:generateCapabilities locally and commit the result."
            exit 1
          fi
          echo "capabilities.json is up to date."

  build:
    name: Build All Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # Compiles every module's main and test sources unconditionally. The
      # per-module test jobs are gated by a change filter, so a change in one
      # module that breaks compilation of an untouched module would otherwise
      # slip through. Test execution and lint are covered by their own jobs, so
      # this deliberately compiles only (no test/check tasks).
      - run: ./gradlew assemble testClasses

  test-opa-evaluator:
    needs: check-changes
    if: needs.check-changes.outputs.opa-evaluator == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21] # 17 is the minimum supported / release JDK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :opa-evaluator:test

  test-opa-jackson:
    needs: check-changes
    if: needs.check-changes.outputs.opa-jackson == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21] # 17 is the minimum supported / release JDK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :opa-jackson:test

  test-opa-services:
    needs: check-changes
    if: needs.check-changes.outputs.opa-services == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21] # 17 is the minimum supported / release JDK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :opa-services:test

  test-opa-builtins:
    needs: check-changes
    if: needs.check-changes.outputs.opa-builtins == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21] # 17 is the minimum supported / release JDK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :opa-builtins:test

  test-opa-slf4j:
    needs: check-changes
    if: needs.check-changes.outputs.opa-slf4j == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21] # 17 is the minimum supported / release JDK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew :opa-slf4j:test

  test-opa-proto:
    needs: check-changes
    if: needs.check-changes.outputs.opa-proto == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21] # 17 is the minimum supported / release JDK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # ProtoComplianceTest reads the compliance fixtures from the sibling opa-evaluator module
      # (../opa-evaluator/...); the full checkout above makes that relative path resolve.
      - run: ./gradlew :opa-proto:test

  verify-proto-vendor:
    name: Verify vendored proto schemas match go.mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/generate-compliance-tests/go.mod
      # The vendored .proto files in opa-proto must always match the OPA version
      # pinned in tools/generate-compliance-tests/go.mod (the source of truth).
      # Re-vendor via the Gradle task and fail if it produces any change — i.e. the
      # OPA version was bumped, or a .proto was hand-edited, without re-vendoring.
      - name: Re-vendor and check for drift
        run: |
          set -e
          ./gradlew --rerun-tasks :opa-proto:vendorProtoSchemas
          if ! git diff --quiet -- opa-proto/src/main/proto; then
            echo "::error::Vendored proto schemas are out of sync with the OPA version in tools/generate-compliance-tests/go.mod. Run ./gradlew :opa-proto:vendorProtoSchemas and commit the result."
            git --no-pager diff -- opa-proto/src/main/proto
            exit 1
          fi
          echo "Vendored proto schemas are in sync with the pinned OPA version."

  pr-check-summary:
    name: PR Check Summary
    runs-on: ubuntu-latest
    needs:
      - check-changes
      - gh-actions-lint
      - rego-policy
      - dependency-review
      - lint
      - validate-pom
      - build
      - verify-proto-vendor
      - test-opa-evaluator
      - test-opa-jackson
      - test-opa-services
      - test-opa-builtins
      - test-opa-slf4j
      - test-opa-proto
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest

      - name: Check job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > input.json

          opa eval -d .github/workflows/pull-request.yml \
            --input=input.json \
            '{job | some _, job in data.jobs["pr-check-summary"].needs} & {job | input[job].result in {"failure", "cancelled"}}' \
            --format=raw > failed_jobs.json

          if [ "$(cat failed_jobs.json)" != "[]" ]; then
            echo "The following required jobs did not complete successfully:"
            jq -r '.[]' failed_jobs.json | sed 's/^/- /'
            exit 1
          fi

          echo "All jobs completed successfully or were skipped"
